---
- name: Set facts for this test
  ansible.builtin.set_fact:
    rmq_host: "localhost"
    rmq_port: "15672"
    rmq_protocol: "http"
    rabbitmq_admin_user: "guest"
    rabbitmq_admin_password: "guest"

    test_user: "test_user"
    test_password: "initial_password"
    new_password: "updated_password"
    test_vhost: "/"

- name: 1. Create the user for the first time
  community.rabbitmq.rabbitmq_user:
    user: "{{ test_user }}"
    password: "{{ test_password }}"
    tags: "management"
    vhost: "{{ test_vhost }}"
    configure_priv: ".*"
    write_priv: ".*"
    read_priv: ".*"
    state: present
    update_password: always
    login_host: "{{ rmq_host }}"
    login_port: "{{ rmq_port }}"
    login_protocol: "{{ rmq_protocol }}"
    login_user: "{{ rabbitmq_admin_user }}"
    login_password: "{{ rabbitmq_admin_password }}"

- name: 2. Run the exact same task again
  community.rabbitmq.rabbitmq_user:
    user: "{{ test_user }}"
    password: "{{ test_password }}"
    tags: "management"
    vhost: "{{ test_vhost }}"
    configure_priv: ".*"
    write_priv: ".*"
    read_priv: ".*"
    state: present
    update_password: always
    login_host: "{{ rmq_host }}"
    login_port: "{{ rmq_port }}"
    login_protocol: "{{ rmq_protocol }}"
    login_user: "{{ rabbitmq_admin_user }}"
    login_password: "{{ rabbitmq_admin_password }}"

- name: 3. Update the user's password (this triggered the 204 error previously)
  community.rabbitmq.rabbitmq_user:
    user: "{{ test_user }}"
    password: "{{ new_password }}"
    tags: "management"
    vhost: "{{ test_vhost }}"
    configure_priv: ".*"
    write_priv: ".*"
    read_priv: ".*"
    state: present
    update_password: always
    login_host: "{{ rmq_host }}"
    login_port: "{{ rmq_port }}"
    login_protocol: "{{ rmq_protocol }}"
    login_user: "{{ rabbitmq_admin_user }}"
    login_password: "{{ rabbitmq_admin_password }}"

- name: 4. Update the user's tags (this triggered the 204 error previously)
  community.rabbitmq.rabbitmq_user:
    user: "{{ test_user }}"
    password: "{{ new_password }}"
    tags: "monitoring, management"
    vhost: "{{ test_vhost }}"
    configure_priv: ".*"
    write_priv: ".*"
    read_priv: ".*"
    state: present
    update_password: always
    login_host: "{{ rmq_host }}"
    login_port: "{{ rmq_port }}"
    login_protocol: "{{ rmq_protocol }}"
    login_user: "{{ rabbitmq_admin_user }}"
    login_password: "{{ rabbitmq_admin_password }}"

- name: 5. Clean up - Remove the test user
  community.rabbitmq.rabbitmq_user:
    user: "{{ test_user }}"
    state: absent
    login_host: "{{ rmq_host }}"
    login_port: "{{ rmq_port }}"
    login_protocol: "{{ rmq_protocol }}"
    login_user: "{{ rabbitmq_admin_user }}"
    login_password: "{{ rabbitmq_admin_password }}"
